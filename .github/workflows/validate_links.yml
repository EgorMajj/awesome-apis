name: "Scheduled link audit"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  FILENAME: README.md

jobs:
  links:
    name: "Check the directory's external links"
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v2

      - name: Prepare Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check every listed link
        run: python scripts/validate/links.py ${FILENAME}
