name: "Directory quality checks"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FILENAME: README.md

jobs:
  checks:
    name: "Check directory changes"
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v2

      - name: Prepare Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install check dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check README tables and descriptions
        run: python scripts/validate/format.py ${FILENAME}

      - name: Check links added in a pull request
        run: scripts/github_pull_request.sh ${{ github.repository }} ${{ github.event.pull_request.number }} ${FILENAME}
        if: github.event_name == 'pull_request'

      - name: Check for duplicate links after a push
        run: python scripts/validate/links.py ${FILENAME} --only_duplicate_links_checker
        if: github.event_name == 'push'
